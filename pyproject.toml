[project]
name = "datasus-fetcher"
version = "0.15.0"
description = "Downloader of DATASUS raw data files"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "data",
    "open data",
    "data fetcher",
    "health",
    "datasus",
    "microdata",
    "brazil",
    "saúde",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
    "Typing :: Typed",
]
dependencies = [
    "quantilica-core>=0.13.0",
]

[project.optional-dependencies]
analysis = [
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    "fastdbf>=0.5.2",
    "dbfread>=2.0.7",
    "quantilica-analytics>=0.5.1",
]

[project.urls]
Homepage = "https://github.com/Quantilica/datasus-fetcher"
Repository = "https://github.com/Quantilica/datasus-fetcher"
Issues = "https://github.com/Quantilica/datasus-fetcher/issues"

[project.scripts]
datasus-fetcher = "datasus_fetcher.cli:main"

[project.entry-points."quantilica.fetchers"]
datasus = "datasus_fetcher.plugin:app"

[project.entry-points."quantilica.lake"]
datasus = "datasus_fetcher.lake:converter"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12",
    "maturin>=1.5,<2.0",
    "dbfread>=2.0.7",
    "fastdbf>=0.5.2",
    # Só para os testes: tests/test_lake.py exercita o comando convert do plugin Typer,
    # que depende do host (quantilica-cli). Não são dependências do pacote.
    "quantilica-cli>=0.13.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/datasus_fetcher/__init__.py" = ["E402"]
"src/datasus_fetcher/meta.py" = ["E501"]

[tool.maturin]
python-source = "src"
module-name = "datasus_fetcher._datasus_dbc"

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"
