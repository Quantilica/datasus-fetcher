name: Public hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Termos internos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Escrever lista de termos
        run: |
          cat > "$RUNNER_TEMP/termos-comuns.txt" <<'EOF'
          \bOnda\b
          \bADR\b
          \bplanning/
          \bplano (`|[a-z0-9-]+-[a-z0-9-]+|§)
          \bPlano:
          uploader
          \bCAS\b
          \bVPS\b
          crontab
          \bcrons?\b
          systemd
          runs\.csv
          quantilica-(workers|cloud|web|events|portal|manifests-db)
          bcb-sgs-app
          rtn-app
          crons-dashboard
          datasus-analytics
          [a-z-]+-metadata-db
          tddata-db
          dev-plugins
          \bOKF\b
          Flamingo
          Alpaca
          Hedgehog
          Sloth
          \bFish\b
          Telegram
          Umami
          Cloudflare
          (^|[^[:alnum:].])/home/[a-z]+
          \.agents/
          CLAUDE\.md
          AGENTS\.md
          EOF
          cat > "$RUNNER_TEMP/termos-arquivos.txt" <<'EOF'
          \bworkspace\b
          ingestão efêmera
          retenção efêmera
          pipeline de ingestão
          EOF
          cat "$RUNNER_TEMP/termos-comuns.txt" "$RUNNER_TEMP/termos-arquivos.txt" \
            > "$RUNNER_TEMP/termos-todos.txt"

      - name: CHANGELOG e README
        run: |
          files=$(ls CHANGELOG.md README*.md docs/changelog.md 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "Nenhum CHANGELOG/README para verificar."
            exit 0
          fi
          hits=$(grep -nIiE -f "$RUNNER_TEMP/termos-todos.txt" $files /dev/null \
            | grep -v 'hygiene-ok' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Termos internos em changelog/README. Reescreva em termos públicos."
            exit 1
          fi
          echo "Limpo."

      - name: Mensagens de commit do PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          range="${BASE_SHA}..${HEAD_SHA}"
          msgs=$(git log --format='%h %s%n%b' "$range")
          hits=$(printf '%s\n' "$msgs" \
            | grep -iE -f "$RUNNER_TEMP/termos-comuns.txt" \
            | grep -v 'hygiene-ok' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Termos internos em mensagem de commit."
            exit 1
          fi
          echo "Limpo."
