name: Public hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Termos internos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ler lista de termos (segredo da organização)
        env:
          HYGIENE_TERMS: ${{ secrets.HYGIENE_TERMS }}
        run: |
          if [ -z "$HYGIENE_TERMS" ]; then
            echo "::warning::Segredo HYGIENE_TERMS indisponível (PR de fork?). Verificação de termos internos ignorada."
            exit 0
          fi
          printf '%s\n' "$HYGIENE_TERMS" > "$RUNNER_TEMP/termos-brutos.txt"
          awk '/^#--arquivos--$/ {exit} NF' "$RUNNER_TEMP/termos-brutos.txt" \
            > "$RUNNER_TEMP/termos-comuns.txt"
          awk '/^#--arquivos--$/ {f=1; next} f && NF' "$RUNNER_TEMP/termos-brutos.txt" \
            > "$RUNNER_TEMP/termos-arquivos.txt"
          cat "$RUNNER_TEMP/termos-comuns.txt" "$RUNNER_TEMP/termos-arquivos.txt" \
            > "$RUNNER_TEMP/termos-todos.txt"

      - name: CHANGELOG e README
        run: |
          [ -s "$RUNNER_TEMP/termos-todos.txt" ] || { echo "Sem lista de termos; verificação ignorada."; exit 0; }
          files=$(ls CHANGELOG.md README*.md docs/changelog.md 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "Nenhum CHANGELOG/README para verificar."
            exit 0
          fi
          hits=$(grep -nIiE -f "$RUNNER_TEMP/termos-todos.txt" $files /dev/null \
            | grep -v 'hygiene-ok' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Termos internos em changelog/README. Reescreva em termos públicos."
            exit 1
          fi
          echo "Limpo."

      - name: Mensagens de commit do PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [ -s "$RUNNER_TEMP/termos-todos.txt" ] || { echo "Sem lista de termos; verificação ignorada."; exit 0; }
          range="${BASE_SHA}..${HEAD_SHA}"
          msgs=$(git log --format='%h %s%n%b' "$range")
          hits=$(printf '%s\n' "$msgs" \
            | grep -iE -f "$RUNNER_TEMP/termos-comuns.txt" \
            | grep -v 'hygiene-ok' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Termos internos em mensagem de commit."
            exit 1
          fi
          echo "Limpo."
