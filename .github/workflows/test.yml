name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # O índice Quantilica (GitHub Pages) já deu flake de DNS no runner
      # (2026-08-23: rtn e inmet) e responde 503 intermitente a pacote que não
      # hospeda (2026-11-15). O pyproject declara o PyPI antes do índice
      # ([[tool.uv.index]]); com first-index só quantilica-analytics passa por ele.
      # Por isso não há --index aqui. Três tentativas removem o flake sem
      # esconder erro real de resolução.
      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            if uv sync --group dev --extra analysis --python ${{ matrix.python-version }}; then
              exit 0
            fi
            echo "::warning::uv sync falhou (tentativa $i/3); nova tentativa em 10s"
            sleep 10
          done
          exit 1

      # Cada `uv run` sem --no-sync re-resolve o lockfile virtual e REMOVE os
      # extras instalados no passo de sync acima (polars/openpyxl já caíram
      # assim: anp 2026-08-29). Todos os passos usam --no-sync.
      - name: Lint with ruff
        run: |
          uv run --no-sync ruff check src/ tests/
          uv run --no-sync ruff format --check src/ tests/

      - name: Run tests with coverage
        # Limiar: [tool.coverage.report] fail_under no pyproject (se houver).
        run: uv run --no-sync pytest --cov --cov-report=term-missing

      - name: Type check with pyright
        continue-on-error: true
        run: uv run --no-sync pyright

  zizmor:
    name: Audit de workflows (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Audit workflows with zizmor
        run: uvx zizmor --no-online-audits --min-severity high .github/workflows
